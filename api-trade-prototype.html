<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bithumb · 손쉬운 API 거래 — AI 자동투자 인터랙티브 프로토타입</title>
<style>
:root{
  --bg:#0b0e14; --panel:#10141d; --ink:#e9edf5; --sub:#8b94a7;
  --line:#1e2430; --bubble-bot:#161c28; --bubble-me:#f7a600; --me-ink:#1a1205;
  --gold:#f7a600; --gold-soft:#3a2c08; --up:#21c17a; --down:#ff5a5f;
  --chip:#1a2130; --pathA:#f7a600; --pathB:#a06bff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;color:var(--ink);padding:24px;
  background-image:radial-gradient(circle at 50% 0%,#1c1c22,#0c0c0e 70%);
}

/* ===== phone shell ===== */
.phone-bezel{
  width:390px;border-radius:48px;background:#1a1a1a;padding:15px;flex:none;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9), inset 0 0 0 2px #2a2a2e;
  position:relative;
}
.screen{
  width:360px;height:800px;overflow:hidden;position:relative;background:var(--bg);
  border-radius:36px;display:flex;flex-direction:column;
}

/* status + app bar */
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 6px;
  font-size:12px;color:var(--ink);font-weight:600;flex:none}
.statusbar .dots{letter-spacing:1px;font-size:11px;color:#cfd6e3}
.appbar{display:flex;align-items:center;gap:10px;padding:6px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.appbar .back{color:var(--sub);font-size:22px;width:24px;cursor:pointer;line-height:1;user-select:none}
.appbar .back:active{color:var(--ink)}
.appbar .h{font-size:14px;font-weight:700;line-height:1.25}
.appbar .h small{display:block;color:var(--gold);font-size:10.5px;font-weight:600;margin-top:1px}
.appbar .pp{margin-left:auto;font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px}
.pp.a{background:var(--gold-soft);color:var(--pathA)}
.pp.b{background:#221a33;color:var(--pathB)}
.pp.c{background:#15202e;color:#7fa8cc}

/* progress dots */
.flowdots{display:flex;gap:5px;justify-content:center;padding:9px 0 4px;flex:none}
.flowdots i{width:6px;height:6px;border-radius:50%;background:#2a3445;transition:.3s}
.flowdots i.on{background:var(--gold);width:18px;border-radius:4px}
.flowdots i.ona{background:var(--pathA);width:18px;border-radius:4px}
.flowdots i.onb{background:var(--pathB);width:18px;border-radius:4px}

/* body scroll */
.body{flex:1;overflow-y:auto;padding:16px 16px 20px;scrollbar-width:thin}
.body::-webkit-scrollbar{width:4px}
.body::-webkit-scrollbar-thumb{background:#222a38;border-radius:4px}

/* footer area (chips / cta) */
.foot{flex:none;padding:10px 16px 18px;border-top:1px solid var(--line);background:linear-gradient(0deg,#0b0e14,#0d111a)}

/* ===== chat ===== */
.avatar{display:flex;align-items:center;gap:7px;margin:2px 0 8px}
.avatar i{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,#f7a600,#ffcf66);
  display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800;color:#1a1205}
.avatar em{font-style:normal;font-size:11.5px;color:var(--sub);font-weight:600}
.msg{max-width:86%;font-size:13px;line-height:1.6;padding:11px 14px;border-radius:17px;margin-bottom:9px}
.msg b{font-weight:700}
.bot{background:var(--bubble-bot);border:1px solid var(--line);border-bottom-left-radius:5px;color:#dde3ee}
.me{background:var(--bubble-me);color:var(--me-ink);margin-left:auto;border-bottom-right-radius:5px;font-weight:600}
.tip{font-size:11px;color:var(--sub);margin:2px 0 10px 4px;line-height:1.5}
.reveal{animation:pop .42s cubic-bezier(.2,.7,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 12px}
.chip{font-size:12px;border:1px solid #2c374a;background:var(--chip);color:#d2d9e6;
  padding:9px 13px;border-radius:18px;font-weight:600;cursor:pointer;transition:.16s;user-select:none}
.chip:active{transform:scale(.96)}
.chip.sel{background:var(--gold);color:#1a1205;border-color:var(--gold)}
.chip.selb{background:var(--pathB);color:#160d24;border-color:var(--pathB)}
.qlabel{font-size:11px;font-weight:700;color:var(--sub);margin:4px 0 7px 2px}

/* route cards */
.routecard{border-radius:15px;padding:14px;margin-bottom:10px;border:1px solid var(--line);background:#131925;cursor:pointer;transition:.18s}
.routecard:active{transform:scale(.985)}
.routecard.a{border-color:#4a3a10;background:linear-gradient(150deg,#1c1604,#12131a)}
.routecard.b{border-color:#3a2c5a;background:linear-gradient(150deg,#14101f,#12131a)}
.routecard.dim{opacity:.55}
.routecard .rt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:6px}
.routecard .rt .badge2{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:9px;margin-left:auto}
.routecard.a .rt .badge2{background:var(--pathA);color:#1a1205}
.routecard.b .rt .badge2{background:var(--pathB);color:#160d24}
.routecard .rd{font-size:11.5px;color:var(--sub);line-height:1.6}
.routecard .rd b{color:#cfd6e3;font-weight:700}

/* strategy cards */
.stratcard{background:#131925;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:.16s}
.stratcard:active{transform:scale(.985)}
.stratcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.stratcard .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.stratcard .nm{font-size:13.5px;font-weight:700}
.risk{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:10px}
.risk.hi{background:#3a1414;color:#ff8a8d}.risk.mid{background:#3a3014;color:#ffd166}.risk.lo{background:#13321f;color:#5fe0a0}
.stratcard .desc{font-size:11.5px;color:var(--sub);line-height:1.55}
.stratcard .alg{font-size:10px;color:#7d889b;margin-top:6px;border-top:1px dashed #232b39;padding-top:6px}

/* param groups */
.pgroup{background:#131925;border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:10px}
.pgroup .lab{font-size:11.5px;color:var(--sub);font-weight:600;margin-bottom:9px;display:flex;justify-content:space-between}
.pgroup .val{color:var(--gold);font-weight:800}
.track{height:6px;background:#222a38;border-radius:4px;position:relative;cursor:pointer;touch-action:none}
.track .fill{position:absolute;left:0;top:0;height:100%;background:var(--gold);border-radius:4px}
.track .knob{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;
  transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.6);cursor:grab}
.track .knob:active{cursor:grabbing;transform:translate(-50%,-50%) scale(1.15)}
.amount{font-size:24px;font-weight:800;text-align:center;padding:6px 0 2px}
.amount small{font-size:14px;color:var(--sub);font-weight:600}
.amthint{font-size:10px;color:var(--sub);text-align:center;margin-bottom:6px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.keypad b{background:#161c28;border:1px solid var(--line);border-radius:10px;text-align:center;
  padding:13px 0;font-size:16px;font-weight:600;color:#dde3ee;cursor:pointer;user-select:none;transition:.1s}
.keypad b:active{background:var(--gold);color:#1a1205}

/* CTA */
.cta{display:block;width:100%;text-align:center;background:var(--gold);color:#1a1205;
  font-weight:800;font-size:14px;padding:15px;border-radius:14px;cursor:pointer;border:none;transition:.15s;user-select:none}
.cta:active{transform:scale(.985);filter:brightness(.95)}
.cta.ghost{background:transparent;border:1px solid #2c374a;color:#cfd6e3}
.cta.purp{background:var(--pathB);color:#160d24}
.cta.dim{background:#222a38;color:#6b7587;pointer-events:none}
.cta+.cta{margin-top:8px}

/* agree */
.agree{background:#131925;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
.agree .hd{font-size:12.5px;font-weight:700;margin-bottom:8px}
.agree .row{display:flex;align-items:center;gap:10px;font-size:12px;padding:7px 0;color:#cfd6e3;cursor:pointer}
.agree .row .ck{width:20px;height:20px;border-radius:7px;background:var(--gold);color:#1a1205;
  display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;transition:.15s}
.agree .row .ck.off{background:#222a38;color:#222a38}
.agree .small{font-size:10px;color:var(--sub);margin-top:8px;line-height:1.55}

/* builder / ranges */
.builder{background:#131925;border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:10px}
.builder .lab{font-size:11.5px;color:var(--sub);font-weight:600;margin-bottom:9px}
.range-row{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.range-row .mn,.range-row .mx{font-size:10px;color:var(--sub);width:40px;flex:none}
.range-row .mx{text-align:right}
.rangehint{font-size:10.5px;color:#7db8ff;margin-top:9px;background:#0e1a2a;border-radius:8px;padding:7px 9px;line-height:1.55}
.rangehint b{color:#9fccff;font-weight:700}

/* formula tokens */
.formula{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11px;
  background:#0e141d;border:1px dashed #2a3445;border-radius:9px;padding:10px;line-height:1.8}
.tok{padding:3px 8px;border-radius:7px;font-weight:700}
.tok.fn{background:#1f2b3a;color:#7db8ff}.tok.op{background:#3a2c08;color:#ffcf66}
.tok.num{background:#13321f;color:#5fe0a0}.tok.var{background:#2a2336;color:#c9a3ff}

/* research */
.research{background:linear-gradient(160deg,#1a1726,#0f1320);border:1px solid #2e2748;border-radius:15px;padding:15px;margin-bottom:10px}
.research .badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:#c9a3ff;
  background:#221a33;padding:5px 10px;border-radius:12px;margin-bottom:12px}
.research .badge .dot{width:8px;height:8px;border-radius:50%;background:#a06bff;animation:pulse2 1.4s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(160,107,255,.6)}70%{box-shadow:0 0 0 9px rgba(160,107,255,0)}100%{box-shadow:0 0 0 0 rgba(160,107,255,0)}}
.research h4{font-size:15px;font-weight:800;margin-bottom:3px}
.research .sub2{font-size:11px;color:var(--sub);margin-bottom:13px}
.ringwrap{display:flex;justify-content:center;margin:4px 0 14px}
.ringtxt{font-size:22px;font-weight:800;fill:#c9a3ff}
.steps{display:flex;flex-direction:column}
.stp{display:flex;gap:11px;font-size:11.5px;padding:6px 0;position:relative}
.stp .ic{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:800;z-index:2}
.stp .ic.done{background:#5fe0a0;color:#0c1f15}.stp .ic.now{background:#a06bff;color:#160d24}.stp .ic.wait{background:#222a38;color:#56607a}
.stp .tx{color:#cfd6e3}.stp.waitc .tx{color:#6b7587}
.stp .tx b{display:block;font-size:9.5px;color:var(--sub);font-weight:500;margin-top:1px}
.stp::before{content:'';position:absolute;left:9.5px;top:16px;bottom:-8px;width:1px;background:#2a3445}
.stp:last-child::before{display:none}
.combo{font-size:11px;color:#c9a3ff;font-weight:700;background:#1c1430;border-radius:9px;padding:9px 11px;margin-top:10px;
  display:flex;justify-content:space-between;align-items:center}
.combo .n{font-variant-numeric:tabular-nums;font-size:13px}

/* candidate cards */
.cand{background:#0f1722;border:1px solid #1c2a3a;border-radius:14px;padding:13px;margin-bottom:10px;position:relative;cursor:pointer;transition:.16s}
.cand:active{transform:scale(.985)}
.cand.best{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cand .rk{position:absolute;top:-9px;left:12px;font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:10px}
.cand .rk.b{background:var(--gold);color:#1a1205}.cand .rk.o{background:#222a38;color:#9aa4b6}
.cand .nm{font-size:13.5px;font-weight:700;margin:4px 0 8px}
.cand .ret{font-size:21px;font-weight:800;color:var(--up)}
.cand .ret small{font-size:10px;color:var(--sub);font-weight:600;display:block}
.cand .fchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.cand .fc{font-size:9px;background:#161c28;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:#aeb7c7;font-weight:600}
.cand .row3{display:flex;gap:14px;margin-top:9px;font-size:9.5px;color:var(--sub)}
.cand .row3 b{color:#dde3ee;display:block;font-size:12.5px;font-weight:700}

/* result card */
.resultcard{background:#0f1722;border:1px solid #1c2a3a;border-radius:15px;padding:14px;margin-bottom:10px}
.bigret{font-size:32px;font-weight:800;color:var(--up);letter-spacing:-1px}
.bigret small{font-size:13px;color:var(--sub);font-weight:600;display:block;margin-bottom:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.kpi{background:#131925;border:1px solid var(--line);border-radius:11px;padding:9px 6px;text-align:center}
.kpi .k{font-size:9.5px;color:var(--sub);font-weight:600}
.kpi .v{font-size:15px;font-weight:800;margin-top:3px}

/* live card */
.livecard{background:linear-gradient(160deg,#13251c,#0f1722);border:1px solid #1e3d2b;border-radius:15px;padding:15px;margin-bottom:10px}
.livecard .badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--up);
  background:#0f2417;padding:5px 10px;border-radius:12px;margin-bottom:11px}
.livecard .badge .dot{width:8px;height:8px;border-radius:50%;background:var(--up);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(33,193,122,.6)}70%{box-shadow:0 0 0 9px rgba(33,193,122,0)}100%{box-shadow:0 0 0 0 rgba(33,193,122,0)}}
.livecard .pnl{font-size:26px;font-weight:800;color:var(--up)}
.livecard .meta2{display:flex;gap:16px;margin-top:10px;font-size:10.5px;color:var(--sub)}
.livecard .meta2 b{color:#dde3ee;display:block;font-size:13px;font-weight:700;margin-top:2px}

/* misc */
.center{display:grid;place-items:center;height:100%;text-align:center;padding:30px}
.center .big{font-size:46px;margin-bottom:14px}
.center h2{font-size:19px;font-weight:800;margin-bottom:8px}
.center p{font-size:12.5px;color:var(--sub);line-height:1.7;max-width:240px}
.restart{position:absolute;top:16px;right:18px;font-size:10px;color:var(--sub);background:#161c28;
  border:1px solid var(--line);padding:5px 10px;border-radius:14px;cursor:pointer;z-index:20}
.restart:active{color:var(--ink)}
.note-inline{font-size:10px;color:#5b6678;text-align:center;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="phone-bezel">
  <div class="screen">
    <div class="restart" id="restart">↻ 처음부터</div>
    <div class="statusbar"><span>9:41</span><span class="dots">5G&nbsp;&nbsp;▦&nbsp;&nbsp;100%</span></div>
    <div class="appbar">
      <span class="back" id="backBtn">‹</span>
      <div class="h" id="appTitle">손쉬운 API 거래<small>AI 전략 도우미</small></div>
      <span class="pp c" id="pathPill" style="display:none">공통</span>
    </div>
    <div class="flowdots" id="flowdots"></div>
    <div class="body" id="body"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   상태
============================================================ */
const S = {
  path:null, exp:null, pref:null, risk:null, strategy:null,
  intentBuy:[], intentSell:[], coin:null,
  amount:1000000, target:3.0, stop:-10.0,
  researchDone:false, candidate:null,
  agreedTerms:false, agreedLive:false,
};
const history = [];

const body = document.getElementById('body');
const foot = document.getElementById('foot');
const appTitle = document.getElementById('appTitle');
const pathPill = document.getElementById('pathPill');
const flowdots = document.getElementById('flowdots');
const backBtn = document.getElementById('backBtn');

/* ============================================================ 유틸 ============================================================ */
function won(n){return n.toLocaleString('ko-KR');}
const SVG_LINE = (pts,color)=>`<svg width="100%" height="100%" viewBox="0 0 90 34" preserveAspectRatio="none"><path d="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;

let timers = [];
function clearTimers(){timers.forEach(t=>{clearTimeout(t);cancelAnimationFrame(t);});timers=[];}

function stagger(scope, step=120){
  const els = scope.querySelectorAll('[data-seq]');
  els.forEach((el,i)=>{el.style.animationDelay=(i*step)+'ms';el.classList.add('reveal');});
}
function setDots(stage, idx, total, kind){
  let html='';
  for(let i=0;i<total;i++){
    let cls=''; if(i===idx) cls = kind==='A'?'ona':kind==='B'?'onb':'on';
    html+=`<i class="${cls}"></i>`;
  }
  flowdots.innerHTML=html;
}
function setPill(kind){
  if(!kind){pathPill.style.display='none';return;}
  pathPill.style.display='inline-block';
  pathPill.className='pp '+(kind==='A'?'a':kind==='B'?'b':'c');
  pathPill.textContent = kind==='A'?'경로 A · 간편':kind==='B'?'경로 B · 탐구':'공통';
}
function setTitle(main, sub){ appTitle.innerHTML = main + (sub?`<small>${sub}</small>`:''); }

/* ============================================================ 네비게이션 ============================================================ */
let current=null;
function go(id, push=true){
  clearTimers();
  if(push && current) history.push(current);
  current = id;
  backBtn.style.visibility = history.length? 'visible':'hidden';
  SCREENS[id]();
  body.scrollTop=0;
}
function back(){
  if(!history.length) return;
  clearTimers();
  current = history.pop();
  backBtn.style.visibility = history.length? 'visible':'hidden';
  SCREENS[current]();
  body.scrollTop=0;
}
backBtn.onclick = back;
document.getElementById('restart').onclick=()=>{
  Object.assign(S,{path:null,exp:null,pref:null,risk:null,strategy:null,intentBuy:[],intentSell:[],coin:null,amount:1000000,target:3.0,stop:-10.0,researchDone:false,candidate:null,agreedTerms:false,agreedLive:false});
  history.length=0; go('onboard',false);
};

/* ============================================================ 슬라이더 ============================================================ */
function makeSlider(el, opts){
  const fill=el.querySelector('.fill'), knob=el.querySelector('.knob');
  let val=opts.value;
  function setPct(){
    const pct=(val-opts.min)/(opts.max-opts.min)*100;
    fill.style.width=pct+'%'; knob.style.left=pct+'%';
  }
  setPct();
  function fromX(clientX){
    const r=el.getBoundingClientRect();
    let p=(clientX-r.left)/r.width; p=Math.max(0,Math.min(1,p));
    let raw=opts.min+p*(opts.max-opts.min);
    val=Math.round(raw/opts.step)*opts.step;
    val=Math.max(opts.min,Math.min(opts.max,val));
    setPct(); opts.onChange(val);
  }
  let dragging=false;
  const down=e=>{dragging=true;fromX((e.touches?e.touches[0]:e).clientX);e.preventDefault();};
  const move=e=>{if(dragging)fromX((e.touches?e.touches[0]:e).clientX);};
  const up=()=>{dragging=false;};
  el.addEventListener('mousedown',down); el.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
}

/* ============================================================ 화면 ============================================================ */
const SCREENS = {};

/* ---------- 00 온보딩 ---------- */
SCREENS.onboard = ()=>{
  setPill(null); setTitle('손쉬운 API 거래','AI 전략 도우미'); setDots(0,0,3,'C');
  body.innerHTML = `
    <div class="avatar" data-seq><i>B</i><em>전략 도우미</em></div>
    <div class="msg bot" data-seq>안녕하세요 👋 복잡한 설정 없이 <b>대화만으로</b> 나만의 자동매매 전략을 만들어 드려요.</div>

      <div class="small">· 유효기간 1년 (매년 오전 9시 만료) · 발급 Key는 암호화 저장되어 화면에 노출되지 않습니다.<br>· 실전 연동 전략은 1개만 운영 가능합니다.</div>
    </div>
    <div class="pgroup" data-seq>
      <div class="lab">실전 운용자금 <span class="val">${won(S.amount)}원</span></div>
      <div style="font-size:10.5px;color:var(--sub)">최소 100,000원 · 원화마켓</div>
    </div>`;
  stagger(body);
  const req={r1:false,r2:false};
  body.querySelectorAll('.row').forEach(r=>r.onclick=()=>{
    const ck=r.querySelector('.ck'); const on=ck.classList.toggle('off')===false;
    req[r.dataset.r]=on;
    const ok=req.r1&&req.r2; document.getElementById('next').classList.toggle('dim',!ok); S.agreedLive=ok;
  });
  foot.innerHTML=`<button class="cta dim" id="next">동의하고 실전 연동 시작</button>`;
  document.getElementById('next').onclick=()=>{if(S.agreedLive)go('connecting');};
};
SCREENS.connecting = ()=>{
  setPill('C'); setTitle('실전 연동 중',''); setDots('C',2,4,'C');
  body.innerHTML=`
    <div class="center">
      <div>
        <div class="big">🔐</div>
        <h2>실전 연동 중…</h2>
        <p>API Key 자동 발급 및 거래 권한을 안전하게 등록하고 있어요.</p>
        <div style="margin-top:18px"><svg width="120" height="6"><rect width="120" height="6" rx="3" fill="#222a38"/><rect id="pb" width="0" height="6" rx="3" fill="#f7a600"/></svg></div>
      </div>
    </div>`;
  foot.innerHTML='';
  const pb=document.getElementById('pb'); const t0=performance.now();
  function up(now){let p=Math.min(1,(now-t0)/1600);pb.setAttribute('width',String(120*p));if(p<1)timers.push(requestAnimationFrame(up));else timers.push(setTimeout(()=>go('c4',false),300));}
  timers.push(requestAnimationFrame(up));
};
SCREENS.c4 = ()=>{
  setPill('C'); setTitle('나의 전략 현황','운영중'); setDots('C',3,4,'C');
  body.innerHTML = `
    <div class="livecard" data-seq>
      <span class="badge"><span class="dot"></span>실전 연동 중</span>
      <div style="font-size:10.5px;color:var(--sub)">평가 손익</div>
      <div class="pnl" id="pnl">+0원 <span style="font-size:13px">(+0.0%)</span></div>
      <div class="meta2">
        <div>운용자금<b>${won(S.amount)}원</b></div>
        <div>오늘 체결<b>8건</b></div>
        <div>연동일<b>D+3</b></div>
      </div>
    </div>
    <div class="avatar" data-seq><i>B</i><em>전략 도우미</em></div>
    <div class="msg bot" data-seq>잘 돌아가고 있어요 ✅ 방금 ETH를 +1.8%에 익절했어요.</div>
    <div class="msg me" data-seq>지금 보유 코인 뭐야?</div>
    <div class="msg bot" data-seq style="max-width:90%">현재 <b>XRP · SOL</b> 2종 보유 중이에요. 평균 보유 시간은 약 22분이에요.</div>`;
  stagger(body);
  const base=Math.round(S.amount*0.042); const pnl=document.getElementById('pnl'); const t0=performance.now();
  function up(now){let p=Math.min(1,(now-t0)/1000);const e=1-Math.pow(1-p,2);pnl.innerHTML='+'+won(Math.round(base*e))+'원 <span style="font-size:13px">(+'+(4.2*e).toFixed(1)+'%)</span>';if(p<1)timers.push(requestAnimationFrame(up));}
  timers.push(requestAnimationFrame(up));
  foot.innerHTML=`
    <div class="chips">
      <span class="chip" id="hist">거래내역 보기</span>
      <span class="chip" id="pause">잠시 중지</span>
      <span class="chip" id="done">🏁 전략 종료</span>
    </div>`;
  // 10-1 전략 종료 → 3(유형 분류)로 이동. onboard/q1 답변은 유지, 전략·리서치·동의 상태만 초기화
  document.getElementById('done').onclick=()=>{
    Object.assign(S,{
      path:null, strategy:null,
      intentBuy:[], intentSell:[], coin:null,
      amount:1000000, target:3.0, stop:-10.0,
      researchDone:false, candidate:null,
      agreedTerms:false, agreedLive:false,
    });
    // history를 유형 분류까지의 흐름만 남김
    const keep=['onboard','q1'];
    history.length=0; keep.forEach(k=>history.push(k));
    go('branch');
  };
  document.getElementById('pause').onclick=()=>{document.getElementById('pause').textContent='⏸ 중지됨';};
  document.getElementById('hist').onclick=()=>{
    // 간단한 인라인 토스트
    const t=document.createElement('div');
    t.style.cssText='position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:#161c28;border:1px solid #2c374a;color:#dde3ee;padding:9px 14px;border-radius:16px;font-size:11.5px;font-weight:600;z-index:30;animation:pop .3s cubic-bezier(.2,.7,.3,1)';
    t.textContent='📒 거래내역: 오늘 체결 8건 · 승률 62%';
    document.querySelector('.screen').appendChild(t);
    setTimeout(()=>t.remove(),1800);
  };
};

/* ============================================================ 시작 ============================================================ */
go('onboard',false);
backBtn.style.visibility='hidden';
</script>
</body>
</html>
